services:
  - type: redis
    name: bands-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: bands-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build -w packages/shared && npm run build -w apps/api
    startCommand: npm run migrate -w apps/api && npm run start -w apps/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: true
      - key: REDIS_URL
        fromService:
          type: redis
          name: bands-redis
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_TG_IDS
        sync: false
      - key: WEB_APP_URL
        value: https://bands-web.onrender.com
      - key: API_PUBLIC_URL
        value: https://bands-api.onrender.com
      - key: TON_PROOF_DOMAIN
        value: bands-web.onrender.com
      - key: TON_MANIFEST_URL
        value: https://bands-web.onrender.com/tonconnect-manifest.json
      - key: ALLOW_DEV_AUTH
        value: false
      - key: USE_MOCK_GIFTS
        value: false

  - type: web
    name: bands-bot
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build -w packages/shared && npm run build -w apps/bot
    startCommand: npm run start -w apps/bot
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: BOT_TOKEN
        sync: false
      - key: WEB_APP_URL
        value: https://bands-web.onrender.com

  - type: web
    name: bands-web
    runtime: static
    buildCommand: npm ci && npm run build -w packages/shared && npm run build -w apps/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        value: https://bands-api.onrender.com
      - key: VITE_APP_URL
        value: https://bands-web.onrender.com
      - key: VITE_TON_MANIFEST_URL
        value: https://bands-web.onrender.com/tonconnect-manifest.json
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
