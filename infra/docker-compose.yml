services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bands
      POSTGRES_USER: bands
      POSTGRES_PASSWORD: bands
    ports:
      - "5432:5432"
    volumes:
      - bands-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  bands-postgres:
